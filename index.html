<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16122a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Selim: Zombi Avcısı</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ffc928'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='Arial' font-weight='bold' fill='%23b3261e'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* ===== Renk değişkenleri ===== */
:root{--bg:#16122a;--panel:#241d3f;--panel2:#30285a;--cizgi:#4a3f80;--yazi:#fff;--soluk:#b9b2dd;--sari:#ffc928;--kirmizi:#e63946;--yesil:#43c463;--mavi:#3aa0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--yazi);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}
h1,h2,h3,.btn,.lf{font-family:"Lilita One",system-ui,sans-serif;font-weight:400;letter-spacing:.5px}

/* ===== Oyun tuvali ===== */
#oyun{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}

/* ===== Ekranlar (menü, garaj vb.) ===== */
.ekran{position:fixed;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:manipulation;z-index:10;
  padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 28px);
  background:radial-gradient(circle at 50% 0%,#3b2a6e 0%,#16122a 62%)}
.ekran.aktif{display:block}
.ic{max-width:760px;margin:0 auto}
.ustBar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ustBar h2{flex:1;margin:0;font-size:26px;text-align:center}

/* ===== Düğmeler ===== */
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:18px;color:#fff;cursor:pointer;background:var(--panel2);box-shadow:0 4px 0 rgba(0,0,0,.35);touch-action:manipulation;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.sari{background:linear-gradient(#ffd84d,#f5a800);color:#3a2300}
.btn.yesil{background:linear-gradient(#5be07a,#22a347)}
.btn.kirmizi{background:linear-gradient(#ff5d6a,#c81d2c)}
.btn.mavi{background:linear-gradient(#5cb6ff,#1f78d1)}
.btn:disabled{opacity:.45;filter:grayscale(.6);cursor:default}
.btn.kucuk{padding:8px 12px;font-size:15px;border-radius:11px}
.btn.genis{width:100%;margin-top:14px;font-size:22px}
.coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffc928 45%,#c98a00);box-shadow:inset 0 0 0 2px #b07700;vertical-align:-.12em;margin-right:4px}
.paraEtiket{background:rgba(0,0,0,.35);padding:8px 12px;border-radius:12px;font-family:"Lilita One",system-ui;font-size:18px;white-space:nowrap}

/* ===== Ana menü ===== */
#menu .ic{display:flex;flex-direction:column;align-items:center;text-align:center}
.ustSag{align-self:flex-end}
.logo{font-family:"Lilita One",system-ui;font-size:clamp(48px,13vw,84px);line-height:.9;margin:6px 0 0;color:var(--sari);text-shadow:0 5px 0 #b3261e,0 9px 18px rgba(0,0,0,.5);transform:rotate(-3deg)}
.logoAlt{font-family:"Lilita One",system-ui;font-size:clamp(22px,6.5vw,36px);color:#9cff57;text-shadow:0 3px 0 #2e6b12;margin:6px 0 4px;transform:rotate(-3deg)}
#selimPortre{width:min(230px,58vw);height:min(230px,58vw);animation:zipla 2.4s ease-in-out infinite}
@keyframes zipla{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.menuBtnler{display:flex;flex-direction:column;gap:12px;width:min(320px,90%);margin-top:8px}
.menuBtnler .btn{font-size:24px;padding:14px}
.alt{color:var(--soluk);font-size:13px;margin-top:16px;line-height:1.6;max-width:420px}

/* ===== Bölüm seçimi ===== */
.dunya{background:var(--panel);border-radius:18px;padding:12px;margin-bottom:14px;border:2px solid var(--cizgi)}
.dunya h3{margin:0 0 10px;font-size:20px;display:flex;align-items:center;gap:8px}
.dunyaRenk{width:18px;height:18px;border-radius:6px;display:inline-block;border:2px solid rgba(255,255,255,.3)}
.bolumIzgara{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.bolumBtn{aspect-ratio:1;border:0;border-radius:13px;background:linear-gradient(#4c3f8f,#352c68);color:#fff;font-family:"Lilita One",system-ui;font-size:21px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35);padding:2px;touch-action:manipulation;line-height:1.05}
.bolumBtn small{font-size:10px;color:var(--sari);letter-spacing:.5px}
.bolumBtn.boss{background:linear-gradient(#d93b48,#8d1622)}
.bolumBtn.kilit{background:#2a2444;color:#6f679a;box-shadow:none;cursor:default;font-size:18px}

/* ===== Garaj ===== */
#garajOn{width:100%;height:190px;display:block;border-radius:18px;background:radial-gradient(ellipse at center,#3d3470 0%,#1f1a38 72%)}
.yatayListe{display:flex;gap:10px;overflow-x:auto;padding:10px 2px}
.arabaKart{flex:0 0 auto;width:130px;border:3px solid transparent;background:var(--panel);border-radius:14px;color:#fff;padding:6px;cursor:pointer;text-align:center;font-family:"Lilita One",system-ui;font-size:15px}
.arabaKart canvas{width:112px;height:62px;display:block;margin:0 auto}
.arabaKart.secili{border-color:var(--sari)}
.arabaKart small{display:block;font-family:system-ui;font-size:12px;color:var(--soluk);margin-top:2px}
.panel{background:var(--panel);border-radius:18px;padding:14px;margin-top:10px;border:2px solid var(--cizgi)}
.statSira{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.statSira b{width:78px;font-weight:600;color:var(--soluk)}
.statBar{flex:1;height:10px;background:#1a1530;border-radius:6px;overflow:hidden}
.statBar i{display:block;height:100%;background:linear-gradient(90deg,#43c463,#c6f75a);border-radius:6px}
.yukSira{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #3a3166}
.yukSira .ad{flex:1}
.yukSira .ad div{font-weight:700}
.yukSira small{color:var(--soluk)}
.pipler{display:flex;gap:3px;margin-top:4px}
.pipler i{width:18px;height:7px;border-radius:3px;background:#1a1530}
.pipler i.dolu{background:var(--sari)}
.maks{font-family:"Lilita One",system-ui;color:var(--sari)}
.renkler{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.renk{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);cursor:pointer;padding:0}
.renk.secili{border-color:#fff;transform:scale(1.12)}
.desenler{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.desenBtn.secili{outline:3px solid var(--sari)}
h4{margin:14px 0 4px;font-size:15px;color:var(--soluk);font-weight:700}

/* ===== Silah dükkanı ===== */
.silahKart{display:flex;gap:12px;background:var(--panel);border:3px solid var(--cizgi);border-radius:16px;padding:12px;margin-bottom:10px;flex-wrap:wrap}
.silahKart.secili{border-color:var(--sari)}
.silahKart canvas{width:120px;height:64px;background:#1a1530;border-radius:12px;flex:0 0 auto}
.silahBilgi{flex:1;min-width:190px}
.silahBilgi h3{margin:0;font-size:20px}
.silahBilgi p{margin:2px 0 6px;color:var(--soluk);font-size:13px}
.etiket{display:inline-block;color:var(--sari);font-weight:800;margin:6px 0}
.bilgiNot{color:var(--soluk);font-size:13px;margin:0 0 10px;text-align:center}

/* ===== Oyun içi gösterge (HUD) ===== */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
.hudUst{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) 0 calc(env(safe-area-inset-left) + 10px)}
.hudSol{display:flex;flex-direction:column;gap:5px;width:min(30vw,200px)}
.hudOrta{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.hudSag{display:flex;gap:6px;align-items:center}
.bar{position:relative;height:16px;background:rgba(0,0,0,.55);border-radius:9px;overflow:hidden;border:2px solid rgba(255,255,255,.25)}
.bar>div{height:100%;width:100%;transform-origin:left center}
.bar span{position:absolute;inset:0;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000;letter-spacing:.5px}
#canDolu{background:linear-gradient(#6fe36f,#2a9d3a)}
#nitroDolu{background:linear-gradient(#69d2ff,#1c7ed6)}
#ilerDolu{background:linear-gradient(#ffd84d,#f08c00)}
.bar.ilerleme{width:100%;max-width:300px;height:18px}
#bolumAd{font-family:"Lilita One",system-ui;font-size:15px;text-shadow:0 2px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#durBtn{pointer-events:auto;width:42px;height:42px;border-radius:12px;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:17px;font-weight:900;cursor:pointer;touch-action:manipulation}
.hudPara{background:rgba(0,0,0,.5);padding:9px 10px;border-radius:12px;font-family:"Lilita One",system-ui;font-size:16px}
#bossBar{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);width:min(80vw,420px);display:none;text-align:center}
#bossDolu{background:linear-gradient(#ff5d6a,#a5101e)}
#bossAd{font-family:"Lilita One",system-ui;font-size:17px;color:#ff9a9a;text-shadow:0 2px 3px #000;margin-bottom:3px}
#ipucu{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.8);background:rgba(0,0,0,.45);padding:6px 10px;border-radius:10px;white-space:nowrap}
#mobilKontrol{position:fixed;right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 16px);display:none;flex-direction:column;align-items:flex-end;gap:12px;z-index:6}
#silahBtn{width:120px;height:78px;border-radius:18px;border:3px solid rgba(255,255,255,.35);background:rgba(20,16,40,.72);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;touch-action:none;cursor:pointer}
#silahBtn canvas{width:96px;height:44px}
#silahBtn span{font-size:11px;font-weight:800}
#nitroBtn{width:88px;height:88px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:radial-gradient(circle at 40% 35%,#7fd6ff,#1767c7);color:#fff;font-family:"Lilita One",system-ui;font-size:17px;touch-action:none;box-shadow:0 5px 0 rgba(0,0,0,.35);cursor:pointer}
#nitroBtn.basili{transform:scale(.92);filter:brightness(1.25)}
body.masaustu #nitroBtn{display:none}
body.dokunmatik #ipucu{display:none}

/* ===== Bölüm başı yazısı ===== */
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;z-index:7;opacity:0;padding:0 16px}
#banner.goster{animation:bannerAn 2.8s ease forwards}
#banner .b1{font-family:"Lilita One",system-ui;font-size:clamp(30px,8vw,58px);color:var(--sari);text-shadow:0 4px 0 #b3261e,0 8px 20px rgba(0,0,0,.6)}
#banner .b2{font-size:clamp(14px,4vw,20px);font-weight:800;text-shadow:0 2px 4px #000;margin-top:6px}
@keyframes bannerAn{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}

/* ===== Açılır pencereler (duraklat, sonuç) ===== */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;background:rgba(10,8,20,.74);padding:16px;overflow-y:auto}
.overlay.aktif{display:flex}
.overlay .panel{width:min(420px,100%);text-align:center;margin:auto}
.overlay h2{margin:4px 0;font-size:34px}
.yildizlar{font-size:46px;letter-spacing:6px;color:#4a4270;line-height:1}
.yildizlar .y{color:var(--sari);text-shadow:0 0 12px rgba(255,201,40,.7)}
#sonucSelim{width:130px;height:130px}
.btnSutun{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.btnSira{display:flex;gap:10px}
.btnSira .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(140px);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;transition:transform .25s;font-weight:700;max-width:90vw;text-align:center;pointer-events:none}
#toast.goster{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<canvas id="oyun"></canvas>

<!-- ============ ANA MENÜ ============ -->
<section class="ekran aktif" id="menu">
  <div class="ic">
    <div class="ustSag"><span class="paraEtiket" id="menuPara"></span></div>
    <div class="logo">SELİM</div>
    <div class="logoAlt">ZOMBİ AVCISI</div>
    <canvas id="selimPortre"></canvas>
    <div class="menuBtnler">
      <button class="btn sari" data-git="bolumler">▶ OYNA</button>
      <button class="btn mavi" data-git="garaj">🚗 GARAJ</button>

<!-- ============ BÖLÜMLER ============ -->
<section class="ekran" id="bolumler">
  <div class="ic">
    <div class="ustBar"><button class="btn kucuk" data-git="menu">← Geri</button><h2>Bölümler</h2><span class="paraEtiket" id="bolumPara"></span></div>
    <div id="bolumListe"></div>
  </div>
</section>

<!-- ============ GARAJ ============ -->
<section class="ekran" id="garaj">
  <div class="ic">
    <div class="ustBar"><button class="btn kucuk" data-git="menu">← Geri</button><h2>Garaj</h2><span class="paraEtiket" id="garajPara"></span></div>
    <canvas id="garajOn"></canvas>
    <div class="yatayListe" id="arabaListe"></div>

<!-- ============ SİLAHLAR ============ -->

    <div id="silahListe"></div>
    <button class="btn sari genis" data-git="bolumler">▶ Oyna</button>

<!-- ============ OYUN İÇİ GÖSTERGE ============ -->
<div id="hud">
  <div class="hudUst">
    <div class="hudSol">
      <div class="bar"><div id="canDolu"></div><span id="canYazi"></span></div>

      <button id="durBtn" aria-label="Duraklat">II</button>
    </div>
  </div>
  <div id="bossBar"><div id="bossAd"></div><div class="bar"><div id="bossDolu"></div></div></div>
  <div id="ipucu">WASD / Oklar: sür · Fare: nişan + ateş · Boşluk: nitro · Q/E: silah · P: duraklat</div>
</div>
<div id="mobilKontrol">
  <button id="silahBtn"><canvas id="silahIkon"></canvas><span id="silahAd"></span></button>
  <button id="nitroBtn">NİTRO</button>
</div>
<div id="banner"><div class="b1" id="banner1"></div><div class="b2" id="banner2"></div></div>

<!-- ============ DURAKLAT ============ -->
<div class="overlay" id="duraklatEkran">
  <div class="panel">
    <h2>Mola</h2>
    <div class="btnSutun">
      <button class="btn yesil" id="devamBtn">▶ Devam Et</button>
      <button class="btn mavi" id="yenidenBtn">↻ Baştan Başla</button>
      <button class="btn" id="sesBtn2">🔊 Ses</button>

<!-- ============ SONUÇ ============ -->
<div class="overlay" id="sonuc">
  <div class="panel">
    <canvas id="sonucSelim"></canvas>
    <h2 id="sonucBaslik"></h2>
    <div class="yildizlar" id="sonucYildiz"></div>
    <div id="sonucBilgi" style="margin:10px 0;color:var(--soluk);line-height:1.6"></div>
    <div class="btnSutun">
      <button class="btn sari" id="sonrakiBtn">Sonraki Bölüm ▶</button>
      <button class="btn mavi" id="tekrarBtn">↻ Tekrar Oyna</button>
      <div class="btnSira">
        <button class="btn" data-git="garaj">🚗 Garaj</button>

</div>

<div id="toast"></div>

<!-- Oyun kodları (sıra önemli) -->
<script>
/* ---- js/veri.js ---- */
'use strict';
/* =========================================================
   SELİM: ZOMBİ AVCISI  —  veri.js
   Yardımcı fonksiyonlar, oyun verileri (arabalar, silahlar,
   zombiler, dünyalar), kayıt sistemi ve ses efektleri.
   ========================================================= */

// ---------- Kısa yardımcı fonksiyonlar ----------
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// İki açı arasındaki en kısa farkı (-PI..PI) verir
function aciFarki(a, b) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

// Tohumlu rastgele sayı üreteci: aynı bölüm hep aynı haritayı üretir
function tohumluRastgele(t) {
  return function () {
    t |= 0; t = (t + 0x6D2B79F5) | 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

// Renk yardımcıları (hex -> rgb, açma/koyulaştırma, parlaklık)
function hexRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function tonla(h, k) { // k > 0 açar, k < 0 koyulaştırır
  const [r, g, b] = hexRgb(h);
  const f = v => Math.round(clamp(k > 0 ? v + (255 - v) * k : v * (1 + k), 0, 255));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function parlaklik(h) {
  const [r, g, b] = hexRgb(h);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}

// Ekranda para ikonu ile miktar gösterir
const paraHtml = n => `<span class="coin"></span>${n}`;

// ---------- ARABALAR ----------
// hiz: azami hız, can: dayanıklılık, donus: dönüş çevikliği, carpma: ezme gücü
// L/W: uzunluk/genişlik (piksel), boya: varsayılan renk sırası
const ARABALAR = [

// ---------- SES EFEKTLERİ (dosya gerektirmez, kodla üretilir) ----------
const Ses = {

  // Tarayıcılar sesi ilk dokunuştan sonra açar
  baslat() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        const n = Math.floor(this.ctx.sampleRate * 0.6);
        const b = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
        const d = b.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        this.gurultu = b;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { /* ses desteklenmiyor */ }
  },
  // Basit ton (osilatör)
  ton(tip, f1, f2, sure, ses) {
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = tip;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + sure);
    g.gain.setValueAtTime(ses, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + sure + 0.02);
  },
  // Gürültü (patlama, alev vb.)
  gur(sure, ses, frek) {
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.gurultu;
    const f = c.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(frek, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(40, frek * 0.2), t + sure);
    const g = c.createGain();
    g.gain.setValueAtTime(ses, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(t); s.stop(t + sure);
  },
  arpej(notalar, aralik, sure, ses) {
    notalar.forEach((f, i) => setTimeout(() => { try { this.ton('square', f, f, sure, ses); } catch (e) {} }, i * aralik));
  },
  cal(ad) {
    if (!K.ses || !this.ctx) return;
    const t = this.ctx.currentTime;
    const min = { ates: 0.05, alev: 0.09, para: 0.04, pof: 0.04, ezme: 0.06, hasar: 0.08 }[ad] || 0.03;

        case 'lazer': this.ton('sawtooth', 1400, 300, 0.12, 0.035); break;
        case 'alev': this.gur(0.12, 0.05, 1600); break;
        case 'buz': this.ton('triangle', 1800, 900, 0.1, 0.05); break;

        case 'patlama': this.gur(0.5, 0.35, 1200); this.ton('sine', 120, 40, 0.4, 0.14); break;
        case 'pof': this.ton('sine', 320, 90, 0.12, 0.07); break;
        case 'ezme': this.ton('square', 140, 60, 0.1, 0.07); break;
        case 'hasar': this.ton('sawtooth', 160, 70, 0.18, 0.06); break;
        case 'para': this.ton('square', 988, 1318, 0.08, 0.025); break;
        case 'tukur': this.ton('sine', 500, 150, 0.15, 0.05); break;

        case 'al': this.arpej([523, 659, 784], 70, 0.09, 0.03); break;
        case 'hata': this.ton('square', 200, 140, 0.15, 0.035); break;
        case 'kazan': this.arpej([523, 659, 784, 1046], 120, 0.18, 0.045); break;
        case 'kaybet': this.arpej([392, 330, 262, 196], 150, 0.2, 0.04); break;
        case 'boss': this.ton('sawtooth', 90, 55, 0.8, 0.07); break;
        case 'can': this.ton('triangle', 600, 1200, 0.2, 0.05); break;

<script>
/* ---- js/cizim.js ---- */
'use strict';
/* =========================================================
   SELİM: ZOMBİ AVCISI  —  cizim.js
   Tüm çizimler kodla yapılır (resim dosyası yok):
   Selim, arabalar, silahlar, zombiler ve harita nesneleri.
   ========================================================= */

let DPR = 1; // ekran piksel yoğunluğu (retina için)

// Yuvarlak köşeli dikdörtgen yolu
function rr(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// Dolu daire
function daire(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
// Yıldız yolu
function yildizYol(ctx, x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr_ = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr_, y + Math.sin(a) * rr_);
  }
  ctx.closePath();
}
// Düzensiz çokgen (kaya, lav gölü için)
function cokgenYol(ctx, x, y, R, nokta, olcek) {
  ctx.beginPath();
  const n = nokta.length;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, r = R * nokta[i] * olcek;
    if (i === 0) ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    else ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}

// ================= SİLAH =================
// Silahı (0,0) noktasından sağa (+x) doğru çizer
function silahCiz(ctx, g) {
  const k = g.kal;
  if (g.roket) { // roketatar: kalın boru
    ctx.fillStyle = g.govde; rr(ctx, -8, -k / 2, g.uz + 10, k, k / 2); ctx.fill();
    ctx.fillStyle = g.namlu; ctx.fillRect(-8, -k / 2, 4, k);
    ctx.fillStyle = '#ff5722';
    ctx.beginPath(); ctx.moveTo(g.uz + 2, -k / 2 + 1); ctx.lineTo(g.uz + 8, 0); ctx.lineTo(g.uz + 2, k / 2 - 1); ctx.fill();
    return;
  }
  // gövde
  ctx.fillStyle = g.govde; rr(ctx, -6, -k / 2 - 1.5, 15, k + 3, 2.5); ctx.fill();
  // namlu
  ctx.fillStyle = g.namlu;
  if (g.cokNamlu) {
    for (const o of [-k * 0.3, 0, k * 0.3]) ctx.fillRect(7, o - 1.1, g.uz - 7, 2.2);
    ctx.fillRect(g.uz - 5, -k * 0.45, 3, k * 0.9);
  } else ctx.fillRect(7, -k / 4, g.uz - 7, k / 2);
  if (g.sarjor) { ctx.fillStyle = '#111'; ctx.fillRect(2, k / 2, 4, k * 0.9); }
  if (g.pompa) { ctx.fillStyle = '#8d6e63'; rr(ctx, g.uz * 0.45, -k / 2, g.uz * 0.3, k, 2); ctx.fill(); }
  if (g.depo) { ctx.fillStyle = g.depo; daire(ctx, 2, -k / 2 - 2, k * 0.55); }
  if (g.isik) { ctx.fillStyle = '#80d8ff'; ctx.fillRect(9, -1, g.uz - 11, 2); }
  if (g.kure) {
    ctx.fillStyle = 'rgba(206,147,216,.45)'; daire(ctx, g.uz, 0, k * 0.9);
    ctx.fillStyle = '#f3e5f5'; daire(ctx, g.uz, 0, k * 0.45);
  }
}
// Silahı bir küçük tuvale (ikon) sığdırarak çizer
function silahIkonCiz(c, id) {
  const w = c.clientWidth || 96, h = c.clientHeight || 44;
  c.width = Math.round(w * DPR); c.height = Math.round(h * DPR);
  const ctx = c.getContext('2d');
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, w, h);
  const g = SILAH_HARITA[id].g;
  const boy = g.uz + 16;
  const s = Math.min(w * 0.82 / boy, h * 0.55 / (g.kal + 8));
  ctx.translate(w / 2 - ((g.uz - 8) / 2) * s, h / 2);
  ctx.scale(s, s);
  silahCiz(ctx, g);
}

// ================= SELİM (üstten görünüm, arabanın içinde) =================
// Kırmızı-sarı tişörtlü, koyu kahve saçlı Selim; silahı nişan yönünde tutar
function selimUstCiz(ctx, aci, g) {
  ctx.save();
  ctx.rotate(aci);
  // silah (kolların altında)
  ctx.save(); ctx.translate(6, 0); silahCiz(ctx, g); ctx.restore();
  // tişört (omuzlar)
  ctx.fillStyle = '#fafafa';
  ctx.beginPath(); ctx.ellipse(-3, 0, 6.5, 11, 0, 0, Math.PI * 2); ctx.fill();
  // kollar: biri sarı biri kırmızı
  ctx.lineCap = 'round'; ctx.lineWidth = 5;
  ctx.strokeStyle = '#f6a623'; ctx.beginPath(); ctx.moveTo(-1, -8.5); ctx.lineTo(8, -3); ctx.stroke();
  ctx.strokeStyle = '#a8102e'; ctx.beginPath(); ctx.moveTo(-1, 8.5); ctx.lineTo(8, 3); ctx.stroke();
  // eller
  ctx.fillStyle = '#f3cfae'; daire(ctx, 9, -2.6, 2.6); daire(ctx, 9, 2.6, 2.6);
  // kulaklar ve kafa
  daire(ctx, 0.5, -8.2, 2.2); daire(ctx, 0.5, 8.2, 2.2);
  daire(ctx, 0, 0, 8);
  // saç: arkayı ve yanları kaplar, öne doğru kakül
  ctx.fillStyle = '#3b2417';
  ctx.beginPath();
  ctx.arc(0, 0, 8.6, 0.38 * Math.PI, 1.62 * Math.PI, false);

// ================= ARABA =================
// Gövde şekli (arabanın tipine göre)
function govdeYolu(ctx, d) {
  const L = d.L, W = d.W;
  switch (d.tip) {
    case 'spor':
      ctx.beginPath();
      ctx.moveTo(-L / 2 + 6, -W / 2);
      ctx.lineTo(L / 2 - 16, -W / 2 + 1);
      ctx.quadraticCurveTo(L / 2 + 1, -W / 4, L / 2, 0);
      ctx.quadraticCurveTo(L / 2 + 1, W / 4, L / 2 - 16, W / 2 - 1);
      ctx.lineTo(-L / 2 + 6, W / 2);
      ctx.quadraticCurveTo(-L / 2, W / 2, -L / 2, W / 2 - 6);
      ctx.lineTo(-L / 2, -W / 2 + 6);
      ctx.quadraticCurveTo(-L / 2, -W / 2, -L / 2 + 6, -W / 2);
      ctx.closePath(); break;
    case 'buggy': rr(ctx, -L / 2 + 5, -W / 2 + 5, L - 10, W - 10, 10); break;
    case 'kamyon': rr(ctx, -L / 2 + 3, -W / 2 + 7, L - 6, W - 14, 7); break;
    case 'tank': rr(ctx, -L / 2 + 5, -W / 2 + 9, L - 10, W - 18, 6); break;
    default: rr(ctx, -L / 2, -W / 2, L, W, d.tip === 'jip' ? 6 : 9);
  }
}
// Tekerlekler / paletler
function tekerlekCiz(ctx, d, jant, zaman) {
  const L = d.L, W = d.W;
  if (d.tip === 'tank') {
    for (const s of [-1, 1]) {
      const y = s > 0 ? W / 2 - 12 : -W / 2;
      ctx.fillStyle = '#263238'; rr(ctx, -L / 2, y, L, 12, 4); ctx.fill();
      ctx.strokeStyle = '#455a64'; ctx.lineWidth = 2;
      const kay = (zaman * 0.6) % 8;
      for (let x = -L / 2 + 3 + kay; x < L / 2 - 2; x += 8) { ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x, y + 10); ctx.stroke(); }
      ctx.fillStyle = jant; for (const x of [-L * 0.3, 0, L * 0.3]) daire(ctx, x, y + 6, 2.2);
    }
    return;
  }
  const buyuk = d.tip === 'kamyon', genis = d.tip === 'buggy';
  const tw = buyuk ? 19 : genis ? 15 : 12, th = buyuk ? 13 : genis ? 10 : 7;
  const ox = L / 2 - tw / 2 - (buyuk ? 3 : 7);
  const oy = W / 2 - th / 2 + (buyuk || genis ? 4 : 1);
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    ctx.fillStyle = '#1b1b1b'; rr(ctx, sx * ox - tw / 2, sy * oy - th / 2, tw, th, 3); ctx.fill();
    ctx.fillStyle = jant; rr(ctx, sx * ox - tw / 4, sy * oy - th / 4, tw / 2, th / 2, 1.5); ctx.fill();
  }
}
// Gövde deseni (gövdeye kırpılmış alanda çizilir)
function desenCiz(ctx, desen, d, boya) {
  const L = d.L, W = d.W;
  const kont = parlaklik(boya) > 0.6 ? 'rgba(0,0,0,.4)' : 'rgba(255,255,255,.8)';
  if (desen === 1) { // şerit
    ctx.fillStyle = kont; ctx.fillRect(-L, -6, 2 * L, 4); ctx.fillRect(-L, 2, 2 * L, 4);
  } else if (desen === 2) { // alev
    const pts = [[0, -1], [0.55, -0.75], [0.35, -0.45], [0.72, -0.2], [0.45, 0], [0.72, 0.2], [0.35, 0.45], [0.55, 0.75], [0, 1]];
    [['#ff3d00', 1], ['#ff9100', 0.74], ['#ffea00', 0.48]].forEach(([r, k]) => {
      ctx.fillStyle = r; ctx.beginPath();
      pts.forEach(([fx, fy], i) => { const x = L / 2 - fx * L * k, y = fy * W / 2 * k; i ? ctx.lineTo(x, y) : ctx.moveTo(x + 4, y); });
      ctx.closePath(); ctx.fill();
    });
  } else if (desen === 3) { // yıldız
    ctx.fillStyle = parlaklik(boya) > 0.6 ? '#e53935' : '#ffeb3b';
    [[-L * 0.32, -W * 0.22, 5], [L * 0.32, W * 0.2, 5], [-L * 0.05, W * 0.28, 4], [L * 0.38, -W * 0.25, 4]].forEach(([x, y, r]) => { yildizYol(ctx, x, y, r); ctx.fill(); });
  } else if (desen === 4) { // damalı
    ctx.fillStyle = kont; const s = 6;
    for (let x = -L / 2; x < L / 2; x += s) for (let y = -W / 2; y < W / 2; y += s)
      if (((Math.round((x + L) / s) + Math.round((y + W) / s)) % 2) === 0) ctx.fillRect(x, y, s, s);
  } else if (desen === 5) { // kaplan
    ctx.fillStyle = 'rgba(20,10,0,.65)';
    for (let x = -L * 0.4; x < L * 0.45; x += L * 0.16) {
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(x - 3, s * W / 2); ctx.quadraticCurveTo(x + 4, s * W * 0.2, x + 1, s * W * 0.05);
        ctx.lineTo(x + 5, s * W * 0.25); ctx.lineTo(x + 4, s * W / 2); ctx.closePath(); ctx.fill();
      }
    }
  }
}
// Arabayı Selim ve silahıyla birlikte çizer (merkez 0,0)
function arabaCiz(ctx, d, oz, aci, tAci, g, zaman, flas) {
  const L = d.L, W = d.W;
  const boya = BOYALAR[oz.boya] || BOYALAR[0];
  const jant = JANTLAR[oz.jant] || JANTLAR[0];
  ctx.save();
  ctx.rotate(aci);
  // gölge
  ctx.fillStyle = 'rgba(0,0,0,.3)'; rr(ctx, -L / 2 + 4, -W / 2 + 5, L, W, 10); ctx.fill();
  tekerlekCiz(ctx, d, jant, zaman);
  // gövde boyası
  govdeYolu(ctx, d); ctx.fillStyle = boya; ctx.fill();
  // desen + ışık gölgelendirme (gövdeye kırpılmış)
  ctx.save(); govdeYolu(ctx, d); ctx.clip();
  desenCiz(ctx, oz.desen, d, boya);
  const gr = ctx.createLinearGradient(0, -W / 2, 0, W / 2);
  gr.addColorStop(0, 'rgba(255,255,255,.28)'); gr.addColorStop(0.5, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(0,0,0,.28)');
  ctx.fillStyle = gr; ctx.fillRect(-L, -W, 2 * L, 2 * W);
  ctx.restore();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,.5)'; govdeYolu(ctx, d); ctx.stroke();
  // ön cam ve arka cam
  if (d.tip !== 'buggy' && d.tip !== 'tank') {
    ctx.fillStyle = '#1d2b3a';
    const w1 = L * 0.08, w2 = L * 0.27, ic = d.tip === 'kamyon' ? 9 : 5;
    ctx.beginPath(); ctx.moveTo(w1, -W / 2 + ic); ctx.lineTo(w2, -W / 2 + ic + 2); ctx.lineTo(w2, W / 2 - ic - 2); ctx.lineTo(w1, W / 2 - ic); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(160,220,255,.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(w1 + 4, -W / 2 + ic + 3); ctx.lineTo(w2 - 3, -W / 2 + ic + 5); ctx.stroke();
    ctx.fillStyle = '#1d2b3a'; rr(ctx, -L * 0.45, -W / 2 + ic + 2, L * 0.07, W - 2 * ic - 4, 2); ctx.fill();
  }
  if (d.tip === 'buggy') { // koruma kafesi
    ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(L * 0.12, -W / 2 + 6); ctx.lineTo(L * 0.12, W / 2 - 6); ctx.stroke();
  }
  if (d.tip === 'tank') { // ön zırh plakası ve perçinler
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(L * 0.22, -W / 2 + 10, L * 0.2, W - 20);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; for (const x of [-L * 0.35, L * 0.1, L * 0.38]) { daire(ctx, x, -W / 2 + 12, 1.5); daire(ctx, x, W / 2 - 12, 1.5); }
  }
  if (d.tip === 'polis') { // siren lambası
    const yan = Math.floor(zaman / 8) % 2;
    ctx.fillStyle = yan ? '#ff1744' : '#7f0000'; ctx.fillRect(L * 0.0, -W * 0.35, 6, W * 0.35);
    ctx.fillStyle = yan ? '#0d47a1' : '#2979ff'; ctx.fillRect(L * 0.0, 0, 6, W * 0.35);
  }
  // farlar ve stop lambaları
  ctx.fillStyle = '#fff59d'; daire(ctx, L / 2 - 4, -W / 2 + 7, 3); daire(ctx, L / 2 - 4, W / 2 - 7, 3);
  ctx.fillStyle = '#ff1744'; ctx.fillRect(-L / 2 + 1, -W / 2 + 6, 3, 5); ctx.fillRect(-L / 2 + 1, W / 2 - 11, 3, 5);
  // Selim'in çıktığı tavan kapağı
  ctx.fillStyle = '#151515'; daire(ctx, d.selimX, 0, 12.5);
  // hasar alınca beyaz parlama
  if (flas > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.7, flas / 10)})`; govdeYolu(ctx, d); ctx.fill(); }
  ctx.restore();
  // Selim ve silahı (arabadan bağımsız döner)
  ctx.save();
  ctx.translate(Math.cos(aci) * d.selimX, Math.sin(aci) * d.selimX);
  selimUstCiz(ctx, tAci, g);
  ctx.restore();
}
// Garaj kartları için küçük araba resmi
function arabaIkonCiz(c, id) {
  const w = c.clientWidth || 112, h = c.clientHeight || 62;
  c.width = Math.round(w * DPR); c.height = Math.round(h * DPR);
  const ctx = c.getContext('2d');
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, w, h);
  const d = ARABA_HARITA[id];
  const oz = K.arabalar[id] || { boya: d.boya, desen: 0, jant: 0 };
  const s = Math.min(w * 0.8 / d.L, h * 0.8 / (d.W + 8));
  ctx.translate(w / 2, h / 2); ctx.scale(s, s);
  arabaCiz(ctx, d, oz, 0, -0.3, SILAH_HARITA[K.silah].g, 0, 0);
}

// ================= ZOMBİ =================
function zombiCiz(ctx, z) {
  const b = z.boy;
  ctx.save(); ctx.translate(z.x, z.y);
  // gölge
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(3, 4, b * 1.05, b * 0.95, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(z.yon);
  const renk = z.yavas > 0 ? '#9fe4ff' : z.renk;
  const koyu = tonla(renk, -0.35);
  // uzanan kollar (yürürken sallanır)
  const sal = Math.sin(z.adim) * b * 0.25;
  ctx.lineCap = 'round'; ctx.strokeStyle = tonla(renk, -0.15); ctx.lineWidth = b * 0.38;
  ctx.beginPath(); ctx.moveTo(0, -b * 0.62); ctx.lineTo(b * 1.25 + sal, -b * 0.55); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, b * 0.62); ctx.lineTo(b * 1.25 - sal, b * 0.55); ctx.stroke();
  // gövde
  ctx.fillStyle = renk; daire(ctx, 0, 0, b);
  ctx.lineWidth = 2; ctx.strokeStyle = koyu; ctx.stroke();
  // tipe özel süslemeler
  if (z.tip === 'sisko') { ctx.fillStyle = koyu; daire(ctx, -b * 0.4, -b * 0.3, b * 0.15); daire(ctx, -b * 0.2, b * 0.45, b * 0.12); daire(ctx, -b * 0.55, b * 0.15, b * 0.1); }
  if (z.tip === 'patlayan') {
    ctx.fillStyle = `rgba(255,235,59,${0.6 + Math.sin(z.adim * 3) * 0.4})`;
    daire(ctx, -b * 0.35, -b * 0.35, b * 0.22); daire(ctx, -b * 0.4, b * 0.3, b * 0.2); daire(ctx, 0, b * 0.05, b * 0.16);
  }
  if (z.tip === 'tukurucu') { ctx.fillStyle = '#9c27b0'; daire(ctx, b * 0.6, -b * 0.55, b * 0.22); daire(ctx, b * 0.6, b * 0.55, b * 0.22); }
  if (z.tip === 'boss') { // taç
    ctx.fillStyle = '#ffd600'; ctx.strokeStyle = '#b28704'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, r = i % 2 ? b * 0.32 : b * 0.5; ctx.lineTo(-b * 0.25 + Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e53935'; daire(ctx, -b * 0.25, 0, b * 0.1);
  }
  // gözler (biri büyük biri küçük — komik görünüm)
  const gx = b * 0.45, gy = b * 0.36, gr = b * 0.27;
  ctx.fillStyle = '#fff'; daire(ctx, gx, -gy, gr); daire(ctx, gx, gy, gr * 0.78);
  ctx.fillStyle = z.tip === 'boss' ? '#d50000' : '#1a1a1a';
  daire(ctx, gx + gr * 0.35, -gy, gr * 0.45); daire(ctx, gx + gr * 0.3, gy, gr * 0.38);
  // ağız ve diş
  ctx.fillStyle = '#3b1f14'; rr(ctx, b * 0.68, -b * 0.22, b * 0.14, b * 0.44, 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(b * 0.7, -b * 0.12, b * 0.1, b * 0.1);
  // vurulunca beyaz parlama
  if (z.flas > 0) { ctx.globalAlpha = 0.7; ctx.fillStyle = '#fff'; daire(ctx, 0, 0, b); ctx.globalAlpha = 1; }
  ctx.restore();
  // yanıyorsa alev
  if (z.yanma > 0) {
    ctx.fillStyle = `rgba(255,${(120 + Math.random() * 100) | 0},0,.65)`;
    daire(ctx, z.x + rand(-b / 2, b / 2), z.y - b * 0.4 + rand(-3, 3), b * 0.38);
  }
  // can barı
  if (z.tip !== 'boss' && z.can < z.maxCan) {
    const w = b * 2;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(z.x - w / 2, z.y - b - 10, w, 5);
    ctx.fillStyle = '#76ff03'; ctx.fillRect(z.x - w / 2, z.y - b - 10, w * clamp(z.can / z.maxCan, 0, 1), 5);
  }
}

// ================= HARİTA NESNELERİ =================
function engelCiz(ctx, e, tip) {

// Yerdeki küçük süsler (dekor)

// ================= SELİM PORTRESİ (menü için, önden görünüm) =================

<script>
/* ---- js/oyun.js ---- */
'use strict';
/* =========================================================
   SELİM: ZOMBİ AVCISI  —  oyun.js
   Oyun motoru: harita üretimi, sürüş fiziği, silahlar,
   zombi yapay zekâsı, efektler, kamera ve ekrana çizim.
   ========================================================= */

const tuval = document.getElementById('oyun');
const cx = tuval.getContext('2d');
let VW = 0, VH = 0, ZOOM = 1;
const DOKUNMATIK = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// Ekran boyutu değişince tuvali yeniden boyutlandır
function boyutla() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  tuval.width = Math.round(VW * DPR); tuval.height = Math.round(VH * DPR);
  // küçük ekranlarda kamera biraz uzaklaşır, daha çok alan görünür
  ZOOM = clamp(Math.min(VW, VH) / 620, 0.55, 1.25);
}

// Aktif oyun durumu (menüdeyken null)
let O = null;

// Girdi durumu: klavye, fare, dokunmatik joystick
const G = {
  tus: {},
  joy: { aktif: false, id: null, bx: 0, by: 0, x: 0, y: 0, vx: 0, vy: 0 },
  fare: { x: 0, y: 0, basili: false },
  dok: null,       // sağ taraftaki nişan parmağı
  nitroBas: false
};

// ================= BÖLÜM AYARLARI =================
function bolumAyar(n) {
  const dIdx = Math.floor((n - 1) / 6);
  const bossVar = n % 6 === 0;
  return {
    n, dIdx, d: DUNYALAR[dIdx], bossVar,
    hedef: bossVar ? 12 + n : 18 + n * 3,           // öldürülmesi gereken zombi
    zorluk: 1 + (n - 1) * 0.09,                      // zombi canı çarpanı
    aralik: Math.max(14, 62 - n * 1.6),              // doğma aralığı (kare)
    maksAktif: Math.min(70, 16 + n * 2),             // aynı anda en fazla zombi
    hizCarpan: 1 + Math.min(0.5, (n - 1) * 0.015)
  };
}
// Bölüme göre zombi tipi seç (ağırlıklı rastgele)
function zombiTipSec(n) {
  const liste = [['normal', 10]];
  if (n >= 2) liste.push(['kosucu', 2 + n * 0.3]);
  if (n >= 4) liste.push(['sisko', 1 + n * 0.15]);
  if (n >= 7) liste.push(['tukurucu', 1 + n * 0.12]);
  if (n >= 10) liste.push(['patlayan', 1 + n * 0.12]);
  let top = 0; liste.forEach(l => top += l[1]);
  let r = Math.random() * top;
  for (const [t, a] of liste) { r -= a; if (r <= 0) return t; }
  return 'normal';
}

// ================= HARİTA ÜRETİMİ =================
function haritaOlustur(A) {
  const r = tohumluRastgele(A.n * 7919 + 13);
  const W = 2600, H = 2600, mx = W / 2, my = H / 2;
  const eng = [], sus = [], lekeler = [], lav = [];
  const merkezBos = (x, y, rad) => Math.hypot(x - mx, y - my) > 280 + rad; // başlangıç alanı boş kalsın
  const cakisir = (x, y, rad) => eng.some(e => e.tip === 'daire'
    ? Math.hypot(e.x - x, e.y - y) < e.r + rad + 30
    : (x > e.x - rad - 30 && x < e.x + e.w + rad + 30 && y > e.y - rad - 30 && y < e.y + e.h + rad + 30));
  const tip = A.d.tip;

  if (tip === 'sehir') {
    // Şehir: ızgara şeklinde binalar ve aralarında yollar
    const hucre = 420, yol = 130;
    const renkler = ['#8d6e63', '#78909c', '#a1887f', '#90a4ae', '#bcaaa4', '#7986cb', '#a5d6a7'];
    for (let gx = 0; gx < W; gx += hucre) for (let gy = 0; gy < H; gy += hucre) {
      if (r() < 0.1) continue; // bazı bloklar boş (park alanı)
      const w = hucre - yol - r() * 70, h = hucre - yol - r() * 70;
      const x = gx + yol / 2 + r() * (hucre - yol - w), y = gy + yol / 2 + r() * (hucre - yol - h);
      const ex = clamp(mx, x, x + w), ey = clamp(my, y, y + h);
      if (Math.hypot(ex - mx, ey - my) < 300) continue;
      const renk = renkler[Math.floor(r() * renkler.length)];
      const detay = [];
      const adet = 2 + Math.floor(r() * 4);
      for (let i = 0; i < adet; i++) {
        const dw = 14 + r() * 26, dh = 14 + r() * 26;
        detay.push({ x: 14 + r() * Math.max(1, w - dw - 28), y: 14 + r() * Math.max(1, h - dh - 28), w: dw, h: dh, r: r() < 0.5 ? 'rgba(0,0,0,.18)' : 'rgba(255,255,255,.18)' });
      }
      eng.push({ tip: 'kutu', x, y, w, h, renk, detay });
    }
  } else {
    // Diğer dünyalar: dağınık ağaç, kaya, kaktüs, çam
    const adet = tip === 'orman' ? 75 : 55;
    for (let i = 0; i < adet * 4 && eng.length < adet; i++) {
      let alt = 'kaya';
      if (tip === 'orman') alt = r() < 0.85 ? 'agac' : 'kaya';
      else if (tip === 'col') alt = r() < 0.4 ? 'kaktus' : 'kaya';
      else if (tip === 'kar') alt = r() < 0.55 ? 'cam' : 'kaya';
      const rad = alt === 'kaktus' ? 16 + r() * 10 : 24 + r() * 38;
      const x = 60 + r() * (W - 120), y = 60 + r() * (H - 120);
      if (!merkezBos(x, y, rad) || cakisir(x, y, rad)) continue;
      const nokta = []; for (let k = 0; k < 9; k++) nokta.push(0.78 + r() * 0.22);
      eng.push({ tip: 'daire', x, y, r: rad, alt, nokta });
    }
  }
  // Patlayıcı kırmızı variller (vurunca patlar!)
  let varil = 0;
  for (let i = 0; i < 80 && varil < 12; i++) {
    const x = 80 + r() * (W - 160), y = 80 + r() * (H - 160);
    if (!merkezBos(x, y, 20) || cakisir(x, y, 15)) continue;
    eng.push({ tip: 'daire', x, y, r: 15, alt: 'varil', patlayici: true, can: 30 });
    varil++;
  }
  // Volkan dünyasında lav gölleri (üstünden geçince hasar)
  if (tip === 'volkan') {
    for (let i = 0; i < 60 && lav.length < 10; i++) {
      const rad = 50 + r() * 50;
      const x = 120 + r() * (W - 240), y = 120 + r() * (H - 240);
      if (!merkezBos(x, y, rad + 40) || cakisir(x, y, rad)) continue;
      const nokta = []; for (let k = 0; k < 12; k++) nokta.push(0.75 + r() * 0.25);
      lav.push({ x, y, r: rad, nokta });
    }
  }
  // Zemin lekeleri ve küçük süsler
  for (let i = 0; i < 45; i++) lekeler.push({ x: r() * W, y: r() * H, r: 60 + r() * 120 });
  for (let i = 0; i < 320; i++) sus.push({ x: r() * W, y: r() * H, t: Math.floor(r() * 3), s: 0.6 + r() * 0.8 });
  return { W, H, eng, sus, lekeler, lav };
}

// ================= ÇARPIŞMA YARDIMCILARI =================
// Daire şeklindeki nesneyi (oyuncu/zombi) engellerin dışına iter
function engelItme(o, r) {
  let carpti = false;
  for (const e of O.harita.eng) {
    if (e.sil) continue;
    if (e.tip === 'kutu') {
      if (o.x < e.x - r || o.x > e.x + e.w + r || o.y < e.y - r || o.y > e.y + e.h + r) continue;
      const kx = clamp(o.x, e.x, e.x + e.w), ky = clamp(o.y, e.y, e.y + e.h);
      const dx = o.x - kx, dy = o.y - ky, d2 = dx * dx + dy * dy;
      if (d2 < r * r) {
        if (d2 > 1e-6) { const d = Math.sqrt(d2); o.x += dx / d * (r - d); o.y += dy / d * (r - d); }
        else { // nesne binanın içine girdiyse en yakın kenara çıkar
          const sol = o.x - e.x, sag = e.x + e.w - o.x, ust = o.y - e.y, alt = e.y + e.h - o.y;
          const m = Math.min(sol, sag, ust, alt);
          if (m === sol) o.x = e.x - r; else if (m === sag) o.x = e.x + e.w + r; else if (m === ust) o.y = e.y - r; else o.y = e.y + e.h + r;
        }
        carpti = true;
      }
    } else {
      const dx = o.x - e.x, dy = o.y - e.y, rr_ = r + e.r;
      if (Math.abs(dx) > rr_ || Math.abs(dy) > rr_) continue;
      const d2 = dx * dx + dy * dy;
      if (d2 < rr_ * rr_) { const d = Math.sqrt(d2) || 0.01; o.x += dx / d * (rr_ - d); o.y += dy / d * (rr_ - d); carpti = true; }
    }
  }
  return carpti;
}
// Bir noktada engel var mı? Varsa engeli döndürür
function engelBul(x, y, r) {
  for (const e of O.harita.eng) {
    if (e.sil) continue;
    if (e.tip === 'kutu') { if (x > e.x - r && x < e.x + e.w + r && y > e.y - r && y < e.y + e.h + r) return e; }
    else { const dx = x - e.x, dy = y - e.y; if (dx * dx + dy * dy < (r + e.r) * (r + e.r)) return e; }
  }
  return null;
}
// En yakın canlı zombiyi bulur
function enYakinZombi(x, y, maks, haric) {
  let en = null, enD = maks * maks;
  for (const z of O.zombiler) {
    if (z.olu || (haric && haric.has(z))) continue;
    const d = (z.x - x) * (z.x - x) + (z.y - y) * (z.y - y);
    if (d < enD) { enD = d; en = z; }
  }
  return en;
}
const ekrandanDunya = (sx, sy) => ({ x: O.kam.x + sx / ZOOM, y: O.kam.y + sy / ZOOM });
const dunyadanEkrana = (x, y) => ({ x: (x - O.kam.x) * ZOOM, y: (y - O.kam.y) * ZOOM });

// ================= EFEKTLER =================
function parcacik(x, y, vx, vy, omur, renk, boy, tip) {
  if (O.parcaciklar.length > 500) return;
  O.parcaciklar.push({ x, y, vx, vy, omur, max: omur, renk, boy, tip: tip || 0 });
}
function yaziEkle(x, y, yazi, renk, boy) {
  if (O.yazilar.length > 40) O.yazilar.shift();
  O.yazilar.push({ x, y, yazi: String(yazi), renk, boy: boy || 14, omur: 55, max: 55 });
}
function selimKonus(yazi) { if (O) O.konusma = { yazi, omur: 150 }; }
// Zombi ölünce "puf" bulutu (kan yok, çocuk dostu)
function pof(z) {
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(0.5, 3);
    parcacik(z.x, z.y, Math.cos(a) * v, Math.sin(a) * v, rand(18, 32), pick(['#c5e1a5', '#aed581', '#f1f8e9']), rand(4, 8) * z.boy / 15, 1);
  }
  for (let i = 0; i < 4; i++) parcacik(z.x, z.y, rand(-2, 2), rand(-3, -1), 30, '#fff59d', 3, 3);
}
// Patlama: alandaki zombilere hasar verir
function patla(x, y, r, hasar, oyuncuya) {
  Ses.cal('patlama');
  O.sarsinti = Math.max(O.sarsinti, r / 8);
  O.halkalar.push({ x, y, r: 10, max: r * 1.2, omur: 20, maxOmur: 20 });
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(1, 5) * r / 80;
    parcacik(x, y, Math.cos(a) * v, Math.sin(a) * v, rand(20, 40), pick(['#ffeb3b', '#ff9800', '#ff5722', '#fff3e0']), rand(5, 11), 0);
  }
  for (let i = 0; i < 10; i++) parcacik(x + rand(-r / 3, r / 3), y + rand(-r / 3, r / 3), rand(-0.5, 0.5), rand(-0.5, 0.5), rand(40, 70), 'rgba(90,90,90,.55)', rand(10, 18), 1);
  if (hasar > 0) {
    for (const z of O.zombiler) {
      if (z.olu) continue;
      const d = Math.hypot(z.x - x, z.y - y);
      if (d < r + z.boy) zombiHasar(z, hasar * (1 - Math.min(1, d / (r + z.boy)) * 0.6), z.x - x, z.y - y, 'roket');
    }
    if (oyuncuya && Math.hypot(O.P.x - x, O.P.y - y) < r + O.a.r) oyuncuHasar(hasar * 0.5);
  }
  // yakındaki variller de zincirleme patlar
  for (const e of O.harita.eng) {
    if (e.patlayici && !e.sil && Math.hypot(e.x - x, e.y - y) < r + e.r) {
      e.can -= Math.max(20, hasar);
      if (e.can <= 0) varilPatlat(e);
    }
  }
}
function varilPatlat(e) {
  if (e.sil) return;
  e.sil = true; O.engelSil = true;
  patla(e.x, e.y, 115, 70 * O.ayar.zorluk, true);
}

// ================= ZOMBİLER =================
function zombiEkle(tip, x, y) {
  const t = ZOMBI_TIPLERI[tip], A = O.ayar;
  const z = {
    tip, x, y, vx: 0, vy: 0,
    can: t.can * A.zorluk, maxCan: t.can * A.zorluk,
    hiz: t.hiz * A.hizCarpan * (tip === 'boss' ? 1 : rand(0.9, 1.1)),
    boy: t.boy, hasar: t.hasar * (1 + (A.n - 1) * 0.04), renk: t.renk,
    para: Math.round(t.para * (1 + A.n * 0.05)),
    flas: 0, yavas: 0, yanma: 0, itx: 0, ity: 0, ramSayac: 0, isirSayac: 20,
    tukSayac: rand(30, 110), adim: Math.random() * 10, yon: Math.atan2(O.P.y - y, O.P.x - x),
    takil: 0, takilYon: 0, olu: false
  };
  if (tip === 'boss') {
    z.renk = A.d.bossRenk; z.ad = A.d.boss;
    z.bossSayac = 180; z.bossFaz = 0; z.hucum = 0;
    O.boss = z;
  }
  O.zombiler.push(z);
  return z;
}
// Ekranın dışında, oyuncunun etrafında zombi doğur
function zombiDogur(tip) {
  const P = O.P, H = O.harita;
  const yaricap = Math.hypot(VW, VH) / ZOOM / 2 + 80;
  for (let deneme = 0; deneme < 10; deneme++) {
    const ac = Math.random() * Math.PI * 2;
    const x = P.x + Math.cos(ac) * yaricap, y = P.y + Math.sin(ac) * yaricap;
    if (x < 30 || y < 30 || x > H.W - 30 || y > H.H - 30) continue;
    if (engelBul(x, y, 30)) continue;
    return zombiEkle(tip || zombiTipSec(O.ayar.n), x, y);
  }
  return null;
}
function zombiHasar(z, h, vx, vy, tur) {
  if (z.olu) return;
  z.can -= h; z.flas = 5;
  if (vx !== undefined) { // geri tepme
    const l = Math.hypot(vx, vy) || 1;
    let it = (tur === 'roket' || tur === 'ezme') ? 5 : (tur === 'alev' ? 0.3 : 1.4);
    if (z.tip === 'boss') it *= 0.08; else if (z.tip === 'sisko') it *= 0.4;
    z.itx += vx / l * it; z.ity += vy / l * it;
  }
  if (tur !== 'alev' && h >= 1) yaziEkle(z.x + rand(-6, 6), z.y - z.boy, Math.round(h), tur === 'ezme' ? '#ff6b6b' : '#ffffff', h >= 30 ? 20 : 14);
  if (z.can <= 0) zombiOldu(z);
}
function zombiOldu(z) {
  if (z.olu) return;
  z.olu = true;
  pof(z); Ses.cal('pof');
  if (z.tip !== 'boss') O.oldurulen++;
  // altın düşür
  const adet = z.tip === 'boss' ? 18 : (z.tip === 'sisko' ? 3 : 1);
  for (let i = 0; i < adet; i++) {
    O.toplanacak.push({ x: z.x + rand(-10, 10), y: z.y + rand(-10, 10), vx: rand(-2.5, 2.5), vy: rand(-2.5, 2.5), tip: 'para', deger: Math.max(1, Math.round(z.para / adet)), omur: 900, faz: Math.random() * 6 });
  }
  // bazen tamir kiti veya nitro düşer
  const r = Math.random();
  if (z.tip === 'boss' || r < 0.035) O.toplanacak.push({ x: z.x, y: z.y, vx: rand(-1, 1), vy: rand(-1, 1), tip: 'can', omur: 900, faz: 0 });
  else if (r < 0.08) O.toplanacak.push({ x: z.x, y: z.y, vx: rand(-1, 1), vy: rand(-1, 1), tip: 'nitro', omur: 900, faz: 0 });
  // kombo
  O.kombo++; O.komboSure = 100;
  if (O.kombo >= 5 && O.kombo % 5 === 0) {
    yaziEkle(O.P.x, O.P.y - 50, 'KOMBO x' + O.kombo + '!', '#ffd84d', 26);
    O.para += O.kombo;
    if (Math.random() < 0.5) selimKonus(pick(SOZ_KOMBO));
  }
  if (z.tip === 'patlayan') patla(z.x, z.y, 85, z.hasar, true);
  if (z.tip === 'boss') {
    O.boss = null;
    patla(z.x, z.y, 160, 0, false);
    O.sarsinti = 22;
    if (O.ayar.bossVar) bolumBitti(true);
  }
}
// Tükürücü zombinin uzaktan attığı yapışkan
function tukur(z) {
  const P = O.P, ac = Math.atan2(P.y - z.y, P.x - z.x);
  O.dmermiler.push({ x: z.x + Math.cos(ac) * z.boy, y: z.y + Math.sin(ac) * z.boy, vx: Math.cos(ac) * 4.5, vy: Math.sin(ac) * 4.5, omur: 110, hasar: z.hasar, r: 6 });
  Ses.cal('tukur');
}
// Boss davranışı: hücum, yardım çağırma, çevreye tükürme
function bossDavranis(z, dt) {
  z.bossSayac -= dt;
  if (z.hucum > 0) {
    z.hucum -= dt;
    if (Math.random() < 0.3) parcacik(z.x, z.y, rand(-1, 1), rand(-1, 1), 30, 'rgba(120,100,80,.5)', 14, 1);
    return z.hiz * 3.3;
  }
  if (z.bossSayac <= 0) {
    z.bossFaz = (z.bossFaz + 1) % 3;
    if (z.bossFaz === 0) {
      z.hucum = 60; yaziEkle(z.x, z.y - z.boy - 10, 'HÜCUM!', '#ff5252', 24); Ses.cal('boss');
    } else if (z.bossFaz === 1) {
      const n = 4 + Math.floor(O.ayar.n / 6);
      for (let i = 0; i < n; i++) {
        const ac = i / n * Math.PI * 2, x = z.x + Math.cos(ac) * 85, y = z.y + Math.sin(ac) * 85;
        if (!engelBul(x, y, 16)) zombiEkle(Math.random() < 0.5 ? 'normal' : 'kosucu', x, y);
      }
      yaziEkle(z.x, z.y - z.boy - 10, 'Yardım çağırdı!', '#b2ff59', 18);
    } else {
      for (let i = 0; i < 12; i++) {
        const ac = i / 12 * Math.PI * 2;
        O.dmermiler.push({ x: z.x, y: z.y, vx: Math.cos(ac) * 4.2, vy: Math.sin(ac) * 4.2, omur: 120, hasar: z.hasar * 0.6, r: 8 });
      }
      Ses.cal('tukur');
    }
    z.bossSayac = 210;
  }
  return z.hiz;
}
function bossCikar() {
  O.bossCikti = true;

  for (let i = 0; i < 20 && !z; i++) {

}

// ================= OYUNCU =================
function oyuncuHasar(h) {
  if (O.bitti) return;
  const P = O.P;
  P.can -= h; P.flas = 8;
  O.sarsinti = Math.max(O.sarsinti, 4);
  Ses.cal('hasar');
  if (P.can <= 0) { P.can = 0; bolumBitti(false); }
  else if (P.can < P.maxCan * 0.3 && !O.dusukUyari) { O.dusukUyari = true; selimKonus('Arabam çok hasar aldı!'); }
}
function topla(t) {
  const P = O.P;
  if (t.tip === 'para') { O.para += t.deger; Ses.cal('para'); }
  else if (t.tip === 'can') {
    P.can = Math.min(P.maxCan, P.can + P.maxCan * 0.3);
    if (P.can > P.maxCan * 0.3) O.dusukUyari = false;
    yaziEkle(P.x, P.y - 40, '+TAMİR', '#69f0ae', 20); Ses.cal('can'); selimKonus('Oh be, tamir oldu!');
  } else if (t.tip === 'nitro') {
    P.nitro = P.maxNitro; yaziEkle(P.x, P.y - 40, 'NİTRO DOLU!', '#40c4ff', 20); Ses.cal('can');
  }
}
function silahDegis(yon) {
  if (!O || O.bitti) return;
  const P = O.P, n = P.silahlar.length;
  if (n < 2) { yaziEkle(P.x, P.y - 40, 'Dükkandan yeni silah al!', '#fff', 14); return; }
  P.silahIdx = (P.silahIdx + yon + n) % n;
  P.atesSayac = Math.max(P.atesSayac, 8);
  silahHudCiz();
  Ses.cal('tik');
  yaziEkle(P.x, P.y - 40, SILAH_HARITA[P.silahlar[P.silahIdx]].ad, '#ffffff', 16);
}

// ================= ATEŞ ETME =================
function atesEt(s, tx, ty) {
  const P = O.P;
  const uc = 6 + s.g.uz + (s.g.roket ? 6 : 0); // namlu ucu uzaklığı
  const mx = tx + Math.cos(P.tAci) * uc, my = ty + Math.sin(P.tAci) * uc;
  // namlu ateşi
  for (let i = 0; i < 3; i++) parcacik(mx, my, Math.cos(P.tAci) * rand(1, 3) + rand(-0.5, 0.5), Math.sin(P.tAci) * rand(1, 3) + rand(-0.5, 0.5), 6, s.tur === 'buz' ? '#e0f7fa' : '#fff59d', 4, 0);
  if (s.tur === 'simsek') { simsekAt(s, mx, my); Ses.cal('simsek'); return; }
  for (let i = 0; i < s.sayi; i++) {
    const ac = P.tAci + (Math.random() - 0.5) * s.sacilma * 2;
    const v = s.mermiHiz * (s.tur === 'alev' ? rand(0.8, 1.2) : 1) * (s.sayi > 1 ? rand(0.85, 1.1) : 1);
    const omur = s.menzil / v;
    O.mermiler.push({
      x: mx, y: my, vx: Math.cos(ac) * v + P.vx * 0.4, vy: Math.sin(ac) * v + P.vy * 0.4,
      hasar: s.hasar, tur: s.tur, omur, max: omur, renk: s.renk, alan: s.alan || 0,
      r: s.tur === 'alev' ? 6 : (s.tur === 'roket' ? 6 : 4),
      vurulan: (s.tur === 'alev' || s.tur === 'lazer') ? new Set() : null,
      delme: s.tur === 'lazer' ? 6 : 0
    });
  }
  const sesAdi = { mermi: s.sayi > 1 ? 'pompali' : 'ates', buz: 'buz', alev: 'alev', roket: 'roket', lazer: 'lazer' }[s.tur];
  Ses.cal(sesAdi);
  if (s.tur === 'roket' || s.sayi > 1) O.sarsinti = Math.max(O.sarsinti, 3);
}
// Yıldırım: en yakın zombiden diğerlerine sıçrar
function simsekAt(s, mx, my) {
  const noktalar = [[mx, my]], vurulan = new Set();
  let hedef = enYakinZombi(mx, my, s.menzil), hasar = s.hasar, sayac = 0;
  if (!hedef) noktalar.push([mx + Math.cos(O.P.tAci) * 120, my + Math.sin(O.P.tAci) * 120]);
  while (hedef && sayac < 5) {
    vurulan.add(hedef);
    noktalar.push([hedef.x, hedef.y]);
    const hx = hedef.x, hy = hedef.y;
    zombiHasar(hedef, hasar, hx - mx, hy - my, 'simsek');
    hasar *= 0.8; sayac++;
    hedef = enYakinZombi(hx, hy, 170, vurulan);
  }
  O.simsekler.push({ noktalar, omur: 10 });
}

// ================= BÖLÜM BAŞLAT / BİTİR =================
function oyunBaslat(n) {

  const ayar = bolumAyar(n);
  const harita = haritaOlustur(ayar);
  const a = arabaStat(K.araba);
  const sahip = SILAHLAR.filter(s => K.silahlar[s.id]).map(s => s.id);
  const P = {
    x: harita.W / 2, y: harita.H / 2, vx: 0, vy: 0, aci: -Math.PI / 2, tAci: -Math.PI / 2, hiz: 0,
    can: a.can, maxCan: a.can, nitro: a.nitro, maxNitro: a.nitro, nitroAktif: false,
    atesSayac: 0, flas: 0, silahlar: sahip, silahIdx: Math.max(0, sahip.indexOf(K.silah))
  };
  O = {
    ayar, harita, a, P,
    zombiler: [], mermiler: [], dmermiler: [], parcaciklar: [], yazilar: [], toplanacak: [], simsekler: [], halkalar: [],
    oldurulen: 0, para: 0, spawnSayac: 50, boss: null, bossCikti: false,
    bitti: false, bitisSayac: 0, kazandi: false, sonucGosterildi: false,
    kombo: 0, komboSure: 0, sarsinti: 0, kam: { x: 0, y: 0 }, zaman: 0,
    hedefZombi: null, hedefSayac: 0, konusma: null, duraklat: false,
    dusukUyari: false, lavSayac: 0, engelSil: false
  };
  O.kam.x = P.x - VW / ZOOM / 2; O.kam.y = P.y - VH / ZOOM / 2;
  // girdileri sıfırla
  G.joy.aktif = false; G.joy.vx = G.joy.vy = 0; G.dok = null; G.fare.basili = false; G.nitroBas = false;
  overlayKapat();
  ekranGoster('oyun');
  silahHudCiz();
  $('#bolumAd').textContent = `Bölüm ${n} · ${ayar.d.ad}`;
  const ipucu = n === 1
    ? (DOKUNMATIK ? 'Sol tarafa dokunup sürükle, Selim otomatik ateş eder!' : 'WASD ile sür, Selim otomatik ateş eder!')
    : (ayar.bossVar ? `${ayar.hedef} zombi, sonra BOSS: ${ayar.d.boss}!` : `${ayar.hedef} zombiyi temizle!`);
  banner(`BÖLÜM ${n}`, ipucu);
  selimKonus(pick(SOZ_BASLA));
}
function bolumBitti(kazandi) {

  } else {
